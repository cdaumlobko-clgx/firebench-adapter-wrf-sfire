[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firebench-adapter-wrf-sfire"
version = "0.1-dev1"
authors = [
    {name = "Aurélien Costes", email = "aurelien.costes31@gmail.com"},
]
maintainers = [
    {name = "Aurélien Costes", email = "aurelien.costes31@gmail.com"},
]
description = "firebench-adapter-wrf-sfire provides a FireBench adapter for the WRF-SFIRE model"
requires-python = ">=3.10"
dependencies = [
    "click >= 8.1",
    "contourpy < 2.0",
    "firebench",
    "geopandas < 2.0",
    "h5py < 4.0",
    "hdf5plugin >= 6.0",
    "netCDF4 < 2.0",
    "numba < 1.0",
    "numpy < 3.0",
    "PyYAML >= 6.0",
    "scipy < 2.0",
]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
]
[project.urls]
Homepage = "https://github.com/wirc-sjsu/firebench-adapter-wrf-sfire"
Documentation = "https://firebench-adapter-wrf-sfire.readthedocs.io/en/latest/"
Repository = "https://github.com/wirc-sjsu/firebench-adapter-wrf-sfire"
Issues = "https://github.com/wirc-sjsu/firebench-adapter-wrf-sfire/issues"
Discussions = "https://github.com/wirc-sjsu/firebench/discussions"

[project.scripts]
fb-sfire = "firebench_adapter_wrf_sfire.cli:main"

[project.optional-dependencies]
dev = [
    "bandit",
    "black",
    "build",
    "myst-parser",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "shapely",
    "sphinx",
    "sphinx-rtd-theme",
    "twine",
]
[tool.hatch.envs.default]
features = ["dev"]
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/firebench_adapter_wrf_sfire"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.black]
line-length = 108
target-version = ["py310"]
